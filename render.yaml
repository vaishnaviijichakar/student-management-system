# ==============================================================
# Render Blueprint (Infrastructure-as-Code)
# Project 1: Student Management System Backend on Render
# Note: Render is used for backend; Vercel is used for frontend.
# Netlify is explicitly NOT used.
# ==============================================================
services:
  # Primary Backend Service (Deployed)
  - type: web
    name: student-management-system-5
    env: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_URL
        sync: false

  # Copied Container Service (Displays below primary service with Status: Failed)
  - type: web
    name: student-management-container-copy
    env: docker
    plan: free
    region: singapore
    dockerfilePath: Dockerfile.render.copy
    autoDeploy: true
    envVars:
      - key: PORT
        value: 5000
